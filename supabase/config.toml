# Configuracion declarativa de Supabase para NutriOliva
project_id = "nutrioliva"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://nutri-oliva.vercel.app"
additional_redirect_urls = [
  "https://nutri-oliva.vercel.app",
  "https://nutri-oliva.vercel.app/set-password",
  "http://localhost:5173",
  "http://localhost:5173/set-password",
  "http://127.0.0.1:5173"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.create-nutricionista]
verify_jwt = false

[functions.invite-patient]
verify_jwt = false

[functions.estimate-calories]
verify_jwt = false

[functions.parse-pdf]
verify_jwt = false
